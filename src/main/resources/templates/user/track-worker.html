<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Live Tracking | HomeEase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; font-family: 'Inter', sans-serif; background: #f8f9fb; overflow: hidden; }

        /* HEADER */
        .track-header {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .header-content { display: flex; align-items: center; gap: 16px; }

        .back-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: #f1f5f9; display: flex; align-items: center; justify-content: center;
            color: #333; text-decoration: none; transition: background 0.2s; font-size: 18px;
        }
        .back-btn:hover { background: #e2e8f0; }

        .worker-info h1 { font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 2px; }
        .worker-info p { font-size: 13px; color: #64748b; font-weight: 500; }

        .status-badge {
            background: #e8f5e9; color: #10b981;
            padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 700; border: 1px solid #bbf7d0;
            display: flex; align-items: center; gap: 6px;
        }
        .status-badge i { animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* MAP */
        #map { width: 100%; height: 100%; z-index: 1; }

        /* BOTTOM PANEL */
        .bottom-panel {
            position: absolute;
            bottom: 20px; left: 20px; right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.4);
            display: flex; justify-content: space-between; align-items: center;
        }

        .eta-block { display: flex; flex-direction: column; }
        .eta-block span { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 1px;}
        .eta-block strong { font-size: 24px; font-weight: 800; color: #1e293b; margin-top: 4px; }

        .worker-contact { display: flex; align-items: center; gap: 12px; }
        .worker-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 800; color: white;
        }
        .call-btn {
            background: #10b981; color: white; border: none;
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 18px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: transform 0.2s;
        }
        .call-btn:hover { transform: translateY(-2px); }

        .loading-overlay {
            position: fixed; inset: 0; z-index: 2000; background: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f1f5f9;
            border-top-color: #f59e0b; border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .track-header { top: 10px; left: 10px; right: 10px; padding: 12px; }
            .bottom-panel { bottom: 10px; left: 10px; right: 10px; padding: 16px; flex-direction: column; align-items: flex-start; gap: 16px; }
            .worker-contact { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <h2 style="font-size: 18px; color: #1e293b;">Connecting to GPS...</h2>
    </div>

    <!-- HEADER -->
    <div class="track-header">
        <div class="header-content">
            <a href="/user/bookings" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="worker-info">
                <h1>Live Tracking</h1>
                <p>Booking #<span th:text="${booking.id}"></span></p>
            </div>
        </div>
        <div class="status-badge" id="statusBadge">
            <i class="fas fa-circle"></i> <span>On the way</span>
        </div>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map"></div>

    <!-- BOTTOM PANEL -->
    <div class="bottom-panel">
        <div class="eta-block">
            <span>Estimated Distance</span>
            <strong id="etaText">Locating...</strong>
        </div>
        <div class="worker-contact">
            <div style="text-align: right;">
                <div style="font-weight: 700; color: #1e293b; font-size: 15px;" th:text="${worker.name}">Name</div>
                <div style="font-size: 12px; color: #64748b;" th:text="${worker.category}">Category</div>
            </div>
            <div class="worker-avatar" th:text="${worker.name.substring(0,1).toUpperCase()}">W</div>
            <a th:href="'tel:' + ${worker.mobile}" class="call-btn"><i class="fas fa-phone-alt"></i></a>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script th:inline="javascript">
        const workerId = /*[[${worker.id}]]*/ 0;
        
        // Use user's booking coordinates for DESTINATION (if any)
        const destLat = /*[[${booking.latitude}]]*/ null;
        const destLng = /*[[${booking.longitude}]]*/ null;

        let map = null;
        let workerMarker = null;
        let destMarker = null;

        // Custom Icons
        const workerIcon = L.divIcon({
            html: '<div style="background:#f59e0b; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(245,158,11,0.4); border:3px solid white;"><i class="fas fa-user-cog" style="color:white; font-size: 18px;"></i></div>',
            className: 'custom-div-icon',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        const destIcon = L.divIcon({
            html: '<div style="background:#10b981; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(16,185,129,0.4); border:3px solid white;"><i class="fas fa-home" style="color:white; font-size: 16px;"></i></div>',
            className: 'custom-div-icon',
            iconSize: [36, 36],
            iconAnchor: [18, 18]
        });

        function initMap(initialLat, initialLng) {
            map = L.map('map', { zoomControl: false }).setView([initialLat, initialLng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);

            // Add destination marker if we have coords
            if (destLat && destLng) {
                destMarker = L.marker([destLat, destLng], { icon: destIcon }).addTo(map);
            }

            workerMarker = L.marker([initialLat, initialLng], { icon: workerIcon }).addTo(map);

            // Fit bounds if both exist
            if (destLat && destLng) {
                const bounds = L.latLngBounds([initialLat, initialLng], [destLat, destLng]);
                map.fitBounds(bounds, { padding: [50, 50] });
            }

            // Hide loading overlay once map is ready
            setTimeout(() => {
                const overlay = document.getElementById('loadingOverlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 500);
            }, 500);
        }

        // Distance formula (Haversine)
        function calcDistance(lat1, lon1, lat2, lon2) {
            const p = 0.017453292519943295;
            const c = Math.cos;
            const a = 0.5 - c((lat2 - lat1) * p)/2 + 
                      c(lat1 * p) * c(lat2 * p) * 
                      (1 - c((lon2 - lon1) * p))/2;
            return 12742 * Math.asin(Math.sqrt(a)); // 2 * R; R = 6371 km
        }

        function updateDistance(wLat, wLng) {
            if (!destLat || !destLng) {
                document.getElementById('etaText').textContent = 'Tracking Worker';
                return;
            }
            const distKm = calcDistance(wLat, wLng, destLat, destLng);
            if (distKm < 0.1) {
                document.getElementById('etaText').textContent = 'Arrived!';
                document.getElementById('etaText').style.color = '#10b981';
            } else if (distKm < 1) {
                document.getElementById('etaText').textContent = (distKm * 1000).toFixed(0) + ' m';
            } else {
                document.getElementById('etaText').textContent = distKm.toFixed(1) + ' km';
            }
        }

        function fetchWorkerLocation() {
            fetch('/user/api/worker-location/' + workerId)
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success' && data.lat && data.lng) {
                        if (!map) {
                            initMap(data.lat, data.lng);
                            updateDistance(data.lat, data.lng);
                        } else {
                            const newLatLng = new L.LatLng(data.lat, data.lng);
                            workerMarker.setLatLng(newLatLng);
                            map.panTo(newLatLng);
                            updateDistance(data.lat, data.lng);
                        }
                    } else if (!map) {
                        // Fallback: If no worker location initially, try destination or default
                        const fallbackLat = destLat || 20.5937;
                        const fallbackLng = destLng || 78.9629;
                        initMap(fallbackLat, fallbackLng);
                        document.getElementById('statusBadge').innerHTML = '<i class="fas fa-exclamation-circle" style="color:#ef4444;"></i> <span style="color:#ef4444;">GPS Off</span>';
                        document.getElementById('etaText').textContent = 'Waiting for Worker GPS...';
                    }
                })
                .catch(err => console.error(err));
        }

        // Initial fetch
        fetchWorkerLocation();

        // Poll every 5 seconds for "live" tracking
        setInterval(fetchWorkerLocation, 5000);

    </script>

<div th:replace="common/translator :: translator"></div>
</body>
</html>
