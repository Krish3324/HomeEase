<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Reset Password | HomeEase</title>
<style>
  body{font-family:Arial;background:#f9f9f9;margin:0;}
  .auth-container{display:flex;justify-content:center;align-items:center;height:80vh;}
  .auth-card{background:#fff;padding:30px 40px;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,0.1);width:350px;text-align:center;}
  .auth-card input{width:100%;padding:10px 15px;margin:10px 0;border:1px solid #ccc;border-radius:5px;}
  .auth-card button{width:100%;padding:12px;background:#f0b429;border:none;border-radius:5px;color:#fff;font-weight:bold;cursor:pointer;}
  .auth-card button:hover{background:#e0a400;}
  .error{color:red;font-size:13px;margin-top:5px;}
</style>
</head>
<body>

<section class="auth-container">
  <div class="auth-card">
    <h2>Reset Password 🔒</h2>

    <form th:action="@{/auth/reset-password}" method="post" onsubmit="return validate()">

      <!-- ✅ CSRF — ADD THIS LINE -->
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <input type="hidden" name="token" th:value="${token}">

      <input type="password" name="password" id="password"
             placeholder="New Password" required>

      <input type="password" id="confirmPassword"
             placeholder="Confirm Password" required>

      <p id="errorMsg" class="error"></p>

      <button type="submit">Update Password</button>
</form>
  </div>
</section>

<script>
  function validate() {
    const pass    = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const err     = document.getElementById('errorMsg');

    if (pass.length < 8) {
      err.innerText = 'Password must be at least 8 characters.';
      return false;
    }
    if (pass !== confirm) {
      err.innerText = 'Passwords do not match.';
      return false;
    }
    return true;
  }
</script>


<div th:replace="common/translator :: translator"></div>
</body>
</html>
