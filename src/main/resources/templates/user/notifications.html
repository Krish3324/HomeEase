<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications | HomeEase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/user-navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <style>
        .notifications-page { padding: 40px 8%; background: #faf7ef; min-height: 80vh; }
        .notif-list { max-width: 800px; margin: 30px auto; }
        .notif-card { 
            background: white; border-radius: 16px; padding: 20px; 
            margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 5px solid #ccc; position: relative;
        }
        .notif-card.unread { border-left-color: #c9a84c; background: #fffdf5; }
        .notif-card.BOOKING_ACCEPTED { border-left-color: #22c55e; }
        .notif-card.BOOKING_PLACED { border-left-color: #3b82f6; }
        .notif-card.BOOKING_DECLINED { border-left-color: #ef4444; }
        
        .notif-time { font-size: 11px; color: #aaa; margin-bottom: 8px; }
        .notif-msg { font-size: 15px; color: #333; line-height: 1.5; }
        .otp-display { 
            display: inline-block; background: #f3f4f6; padding: 4px 10px; 
            border-radius: 6px; font-weight: 800; color: #111; letter-spacing: 1px;
            margin-top: 10px; border: 1px dashed #ccc;
        }
    </style>
</head>
<body>
    <div th:replace="common/user-navbar :: userNavbar"></div>

    <main class="notifications-page">
        <h2 style="text-align:center;">Your Notifications</h2>
        
        <div class="notif-list">
            <div th:each="n : ${notifications}" class="notif-card" 
                 th:classappend="${n.type.name()} + (n.read ? '' : ' unread')">
                <div class="notif-time" th:text="${#temporals.format(n.createdAt, 'dd MMM, HH:mm')}">Time</div>
                <div class="notif-msg" th:utext="${n.message}">Message content</div>
                <div th:if="${n.otp != null}" class="otp-display">
                    OTP: <span th:text="${n.otp}">123456</span>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(notifications)}" style="text-align:center; padding:60px;">
                <p style="color:#888;">No notifications yet.</p>
            </div>
        </div>
    </main>

    <div th:replace="common/footer :: footer"></div>
</body>
</html>
