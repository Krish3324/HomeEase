<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chat | HomeEase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/user-navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fb; }

        .page-header { background: white; padding: 28px 40px; border-bottom: 1px solid #eee; }
        .page-header h1 { font-size: 24px; font-weight: 700; color: #1c1c1c; }

        .container { max-width: 800px; margin: 0 auto; padding: 24px; height: calc(100vh - 120px); display: flex; flex-direction: column; }

        .chat-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid #f0f0f0;
            background: linear-gradient(135deg, #f5f5f5, #fafafa);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .worker-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8cc7a, #c9a84c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }

        .worker-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: #1c1c1c;
            margin-bottom: 2px;
        }

        .worker-info p {
            font-size: 12px;
            color: #888;
        }

        .back-btn {
            margin-left: auto;
            background: white;
            border: 1px solid #e0e0e0;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover { background: #f5f5f5; border-color: #d0d0d0; }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message-bubble {
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, #c9a84c, #e8cc7a);
            color: white;
            border-radius: 16px 0 16px 16px;
        }

        .message.received .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 0 16px 16px 16px;
        }

        .message-time {
            font-size: 11px;
            color: #aaa;
            align-self: flex-end;
            margin-bottom: 2px;
        }

        .sender-name {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .message.sent .message-time { text-align: right; }

        .empty-message {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            padding: 40px 20px;
            background: #fafafa;
            border-radius: 12px;
            margin: auto;
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #e0e0e0;
            background: white;
            display: flex;
            gap: 12px;
        }

        .disabled-message {
            text-align: center;
            padding: 24px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            color: #991b1b;
            font-size: 14px;
            font-weight: 600;
        }

        .message-input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            transition: border-color 0.2s;
        }

        #messageInput:focus {
            outline: none;
            border-color: #c9a84c;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, #c9a84c, #e8cc7a);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            font-weight: bold;
        }

        .send-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(201,168,76,0.3); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        @media (max-width: 768px) {
            .container { padding: 16px; height: calc(100vh - 100px); }
            .message-bubble { max-width: 80%; }
            .page-header { padding: 20px; }
            .page-header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav th:replace="common/user-navbar :: userNavbar"></nav>

    <!-- Page Header -->
    <div class="page-header">
        <h1>💬 Chat with Worker</h1>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="chat-container">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="worker-avatar" th:text="${booking.worker.name.substring(0,1).toUpperCase()}">W</div>
                <div class="worker-info">
                    <h3 th:text="${booking.worker.name}">Worker Name</h3>
                    <p th:text="'Booking: ' + ${booking.bookingDate} + ' @ ' + ${booking.bookingTime}">Booking Date</p>
                </div>
                <a href="/user/bookings" class="back-btn">← Back to Bookings</a>
            </div>

            <!-- Messages Container -->
            <div class="messages-container" id="messagesContainer">
                <div class="empty-message">Loading messages...</div>
            </div>

            <!-- Input Area -->
            <div class="input-area" id="inputArea">
                <div class="disabled-message" id="disabledMessage" style="display: none; width: 100%; margin: 0;">
                    💬 Messaging is disabled. This booking is no longer active.
                </div>
                <div class="message-input-wrapper" id="messageInputWrapper">
                    <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        let bookingId = new URLSearchParams(window.location.search).get('bookingId');
        let autoRefresh;

        if (!bookingId) {
            window.location.href = '/user/bookings';
        }

        // Initialize the page
        async function initPage() {
            await checkMessagingAllowed();
            await loadMessages();
            startAutoRefresh();
        }

        // Check if messaging is allowed
        async function checkMessagingAllowed() {
            try {
                const response = await fetch(`/messages/allowed/${bookingId}`);
                const data = await response.json();

                const inputWrapper = document.getElementById('messageInputWrapper');
                const disabledMessage = document.getElementById('disabledMessage');
                const sendBtn = document.getElementById('sendBtn');
                const messageInput = document.getElementById('messageInput');

                if (data.canMessage) {
                    inputWrapper.style.display = 'flex';
                    disabledMessage.style.display = 'none';
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                } else {
                    inputWrapper.style.display = 'none';
                    disabledMessage.style.display = 'block';
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                }
            } catch (error) {
                console.error('Error checking messaging status:', error);
            }
        }

        // Load messages
        async function loadMessages() {
            try {
                const response = await fetch(`/messages/booking/${bookingId}`);
                const data = await response.json();

                if (data.status === 'success') {
                    const container = document.getElementById('messagesContainer');
                    container.innerHTML = '';

                    if (data.messages.length === 0) {
                        container.innerHTML = '<div class="empty-message">No messages yet. Start chatting!</div>';
                    } else {
                        data.messages.forEach(msg => {
                            const messageDiv = document.createElement('div');
                            messageDiv.className = `message ${msg.senderType === 'USER' ? 'sent' : 'received'}`;

                            const sentTime = new Date(msg.sentAt);
                            const timeStr = sentTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                            messageDiv.innerHTML = `
                                <div style="display:flex;flex-direction:column;max-width:75%;min-width:100px;">
                                    <div class="sender-name">${escapeHtml(msg.senderName)}</div>
                                    <div class="message-bubble">${escapeHtml(msg.messageText)}</div>
                                    <div class="message-time">${timeStr}</div>
                                </div>
                            `;

                            container.appendChild(messageDiv);
                        });

                        // Scroll to bottom
                        container.scrollTop = container.scrollHeight;
                    }

                    // Update messaging availability
                    await checkMessagingAllowed();
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Send message
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                const response = await fetch('/messages/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `bookingId=${bookingId}&messageText=${encodeURIComponent(message)}`
                });

                const data = await response.json();

                if (data.status === 'success') {
                    messageInput.value = '';
                    messageInput.style.height = 'auto';
                    await loadMessages();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message');
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        });

        // Auto-expand textarea
        document.getElementById('messageInput').addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Send on Enter (Shift+Enter for new line)
        document.getElementById('messageInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('sendBtn').click();
            }
        });

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Start auto-refresh every 2 seconds
        function startAutoRefresh() {
            autoRefresh = setInterval(loadMessages, 2000);
        }

        // Stop auto-refresh on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefresh) clearInterval(autoRefresh);
        });

        // Initialize page
        initPage();
    </script>
</body>
</html>
