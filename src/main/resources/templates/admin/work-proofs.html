<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Work Proofs Gallery | Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <style>
        .gallery-page { padding: 40px 8%; background: var(--light-bg); min-height: 80vh; }
        .proof-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            margin-top: 30px; 
        }
        .proof-card { 
            background: white; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .proof-card:hover { transform: translateY(-5px); }
        .proof-img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            cursor: pointer;
        }
        .proof-info { 
            padding: 15px; 
            border-top: 1px solid #eee;
        }
        .worker-name { font-weight: 700; color: var(--primary); font-size: 14px; }
        .booking-id { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .upload-date { font-size: 11px; color: #999; margin-top: 8px; }
        
        .search-container { margin-bottom: 30px; }
    </style>
</head>
<body>
    <div th:replace="common/admin-navbar :: adminNavbar"></div>

    <main class="gallery-page">
        <div class="page-header">
            <h2>Work Proofs Gallery</h2>
            <p>Monitor work documentation uploaded by workers.</p>
        </div>

        <div class="search-container">
            <form th:action="@{/admin/work-proofs}" method="get" class="he-search-bar">
                <input type="text" name="search" th:value="${search}" class="he-input" placeholder="Search by Specific Worker Name...">
                <button type="submit" class="he-btn he-btn-primary">Filter Workers</button>
                <a th:if="${search != null}" th:href="@{/admin/work-proofs}" class="he-btn he-btn-secondary">Clear</a>
            </form>
        </div>

        <div class="proof-grid" th:if="${!#lists.isEmpty(proofs)}">
            <div class="proof-card" th:each="p : ${proofs}">
                <a th:href="${p.imagePath}" target="_blank">
                    <img th:src="${p.imagePath}" class="proof-img" alt="Work Proof">
                </a>
                <div class="proof-info">
                    <div class="worker-name" th:text="${p.booking.worker.name}">Worker Name</div>
                    <div class="booking-id" th:text="'Booking #' + ${p.booking.id}">Booking #123</div>
                    <div class="booking-id" style="color: #666;" th:text="${p.booking.worker.category}">Category</div>
                    <div class="upload-date">
                        <i class="far fa-clock"></i> 
                        <span th:text="${#temporals.format(p.uploadedAt, 'dd MMM yyyy, HH:mm')}">Date</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="he-card" th:if="${#lists.isEmpty(proofs)}" style="text-align: center; padding: 60px;">
            <div style="font-size: 40px; margin-bottom: 20px;">🖼️</div>
            <h3>No work proofs found</h3>
            <p style="color: var(--muted);">Either no images have been uploaded yet or your search returned no results.</p>
        </div>
    </main>

    <div th:replace="common/footer :: footer"></div>
</body>
</html>
