<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password | HomeEase</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

    <header class="navbar">
        <h2>HomeEase</h2>
        <a href="/login" class="nav-link">Back to Login</a>
    </header>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Reset Password 🔑</h2>
            <p>Enter your new password below.</p>

            <!-- Error -->
            <div th:if="${error}" style="color:red; margin:10px 0; font-size:14px;">
                <p th:text="${error}"></p>
            </div>

            <!-- Success -->
            <div th:if="${success}" style="color:green; margin:10px 0; font-size:14px;">
                <p th:text="${success}"></p>
                <a href="/login" style="display:block; text-align:center; margin-top:10px;">
                    Go to Login
                </a>
            </div>

            <!-- Show form only if no success -->
            <form th:if="${success == null}" action="/auth/reset-password2" method="post">

                <!-- Hidden token -->
                <input type="hidden" name="token" th:value="${token}">

                <input type="password" name="password" placeholder="New Password" required minlength="6">

                <input type="password" name="confirmPassword" placeholder="Confirm New Password" required minlength="6">

                <button type="submit">Reset Password</button>
            </form>

            <p class="switch">
                Remember your password?
                <a href="/login">Login here</a>
            </p>
        </div>
    </section>


<div th:replace="common/translator :: translator"></div>
</body>

</html>
