<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password | HomeEase</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

    <header class="navbar">
        <h2>HomeEase</h2>
        <a href="/login" class="nav-link">Back to Login</a>
    </header>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Forgot Password 🔒</h2>
            <p>Enter your registered email address and we'll send you a reset link.</p>

            <!-- Error -->
            <div th:if="${error}" style="color:red; margin:10px 0; font-size:14px;">
                <p th:text="${error}"></p>
            </div>

            <!-- Success -->
            <div th:if="${success}" style="color:green; margin:10px 0; font-size:14px;">
                <p th:text="${success}"></p>
            </div>

            <form action="/auth/forgot-password" method="post">
                <input type="email" name="email" placeholder="Enter your email address" required>
                <button type="submit">Send Reset Link</button>
            </form>

            <p class="switch">
                Remember your password?
                <a href="/login">Login here</a>
            </p>
        </div>
    </section>


<div th:replace="common/translator :: translator"></div>
</body>

</html>
