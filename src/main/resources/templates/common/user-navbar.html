<nav class="user-navbar" th:fragment="userNavbar">

    <div class="nav-left">
        <span class="brand-icon">HE</span>
        <div class="brand-group">
            <span class="logo">HomeEase</span>
            <span class="role">User</span>
        </div>
    </div>

    <ul class="nav-links" id="userNavLinks">
        <li><a href="/user/dashboard">Dashboard</a></li>
        <li><a href="/user/profile">Profile</a></li>
        <li><a href="/user/bookings">My Bookings</a></li>
        <li>
            <a href="/user/my-quotes" class="nav-link">
                My Submitted Quotes
                <span class="badge badge-danger" id="quotationUserBadge" style="display: none;">
                    <span id="quotationUserCount">0</span>
                </span>
            </a>
        </li>
        <li><a href="/logout" class="logout">Logout</a></li>
    </ul>

    <script>
        function updateUserQuotationBadge() {
            fetch('/api/quotations/user/unread-count')
                .then(r => r.json())
                .then(data => {
                    const count = data.unreadCount || 0;
                    const badge = document.getElementById('quotationUserBadge');
                    const countEl = document.getElementById('quotationUserCount');
                    
                    if (count > 0) {
                        countEl.innerText = count > 99 ? '99+' : count;
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }
                })
                .catch(error => console.error('Error fetching user quotation badge:', error));
        }

        function updateUserChatBadge() {
            fetch('/messages/unread/count')
                .then(r => r.json())
                .then(data => {
                    const count = data.unreadCount || 0;
                    const badge = document.getElementById('chatUnreadBadge');
                    const countEl = document.getElementById('chatUnreadCount');

                    if (count > 0) {
                        countEl.innerText = count > 99 ? '99+' : count;
                        badge.style.display = 'inline-flex';
                    } else {
                        badge.style.display = 'none';
                    }
                })
                .catch(error => console.error('Error fetching chat unread badge:', error));
        }

        // Update on page load
        document.addEventListener('DOMContentLoaded', function () {
            updateUserQuotationBadge();
            updateUserChatBadge();
        });

        // Update every 30 seconds
        setInterval(updateUserQuotationBadge, 30000);
        setInterval(updateUserChatBadge, 30000);
    </script>

    <button type="button" class="hamburger" onclick="toggleUserMenu()">☰</button>

</nav>
