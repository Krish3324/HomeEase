<nav class="worker-navbar" th:fragment="workerNavbar">
    <style>
        .worker-navbar {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .worker-navbar .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 220px;
        }

        .worker-navbar .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #111827;
            font-weight: 800;
            font-size: 16px;
        }

        .worker-navbar .brand-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .worker-navbar .logo {
            font-size: 18px;
            font-weight: 700;
            color: #111827;
        }

        .worker-navbar .role {
            font-size: 12px;
            color: #4b5563;
            background: rgba(249, 115, 22, 0.12);
            padding: 4px 10px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .worker-navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            margin: 0;
            padding: 0;
            flex-wrap: wrap;
        }

        .worker-navbar .nav-links li {
            margin: 0;
        }

        .worker-navbar .nav-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 999px;
            transition: background 0.2s ease, color 0.2s ease;
            white-space: nowrap;
        }

        .worker-navbar .nav-links a:hover,
        .worker-navbar .nav-links a.active {
            background: #f8fafc;
            color: #111827;
        }

        .worker-navbar .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            background: #ef4444;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
        }

        .worker-navbar .logout {
            color: #ef4444;
            border: 1px solid transparent;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .worker-navbar .logout:hover {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .worker-navbar .hamburger {
            display: none;
            border: none;
            background: #111827;
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
        }

        @media (max-width: 900px) {
            .worker-navbar {
                justify-content: space-between;
            }
            .worker-navbar .nav-links {
                width: 100%;
                display: none;
                flex-direction: column;
                gap: 6px;
                margin-top: 10px;
            }
            .worker-navbar .nav-links.open {
                display: flex;
            }
            .worker-navbar .nav-links a {
                width: 100%;
                justify-content: flex-start;
                padding: 12px 16px;
            }
            .worker-navbar .hamburger {
                display: inline-flex;
            }
        }
    </style>

    <div class="nav-left">
        <span class="brand-icon">HE</span>
        <div class="brand-group">
            <span class="logo">HomeEase</span>
            <span class="role">Worker</span>
        </div>
    </div>

    <ul class="nav-links" id="workerNavLinks">
        <li><a href="/worker/dashboard" class="nav-link">Dashboard</a></li>
        <li><a href="/worker/profile" class="nav-link">Profile</a></li>
        <li><a href="/worker/bookings" class="nav-link">My Bookings</a></li>
        <li>
            <a href="/worker/quote-requests" class="nav-link">
                <i class="fas fa-bell"></i> Quotations
                <span class="badge badge-danger" id="quotationNotificationBadge" style="display: none;">
                    <span id="quotationCount">0</span>
                </span>
            </a>
        </li>
        <li><a href="/logout" class="logout">Logout</a></li>
    </ul>

    <button type="button" class="hamburger" onclick="toggleWorkerMenu()">☰</button>

    <script>
        function updateQuotationBadge() {
            fetch('/api/quotations/worker/unread-count')
                .then(r => r.json())
                .then(data => {
                    const count = data.unreadCount || 0;
                    const badge = document.getElementById('quotationNotificationBadge');
                    const countEl = document.getElementById('quotationCount');
                    
                    if (count > 0) {
                        countEl.innerText = count > 99 ? '99+' : count;
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }
                })
                .catch(error => console.error('Error fetching quotation badge:', error));
        }

        function updateWorkerChatBadge() {
            fetch('/messages/unread/count')
                .then(r => r.json())
                .then(data => {
                    const count = data.unreadCount || 0;
                    const badge = document.getElementById('chatUnreadBadge');
                    const countEl = document.getElementById('chatUnreadCount');

                    if (count > 0) {
                        countEl.innerText = count > 99 ? '99+' : count;
                        badge.style.display = 'inline-flex';
                    } else {
                        badge.style.display = 'none';
                    }
                })
                .catch(error => console.error('Error fetching chat unread badge:', error));
        }

        // Update on page load
        document.addEventListener('DOMContentLoaded', function () {
            updateQuotationBadge();
            updateWorkerChatBadge();
        });

        // Update every 30 seconds
        setInterval(updateQuotationBadge, 30000);
        setInterval(updateWorkerChatBadge, 30000);

        function toggleWorkerMenu() {
            const navLinks = document.getElementById('workerNavLinks');
            if (navLinks) {
                navLinks.classList.toggle('open');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const links = document.querySelectorAll('.worker-navbar .nav-links a');
            const current = window.location.pathname;
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href && current.startsWith(href)) {
                    link.classList.add('active');
                }
            });
        });
    </script>

</nav>
