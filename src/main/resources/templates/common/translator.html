<div th:fragment="translator" xmlns:th="http://www.thymeleaf.org">
    <!-- Google Translate Widget Style Wrapper -->
    <style>
        .lang-floater {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 99999;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 30px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }

        .lang-floater:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        .lang-floater i {
            color: #c9a84c; /* HomeEase gold accent */
            font-size: 18px;
        }

        /* Override Google Translate default gross styling where possible */
        .goog-te-gadget {
            font-family: 'Inter', sans-serif !important;
            font-size: 13px !important;
            color: transparent !important;
        }
        
        .goog-te-gadget .goog-te-combo {
            margin: 0 !important;
            padding: 4px 8px !important;
            border-radius: 6px !important;
            border: 1px solid #e2e8f0 !important;
            background: #f8fafc !important;
            color: #1e293b !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 13px !important;
            outline: none !important;
            cursor: pointer;
        }

        /* Hide the Google Translate top ribbon that shifts the page down */
        .skiptranslate.goog-te-banner-frame {
            display: none !important;
        }
        body {
            top: 0px !important; 
        }

        /* Hide Google logo inside gadget */
        .goog-logo-link {
            display:none !important;
        } 
        .goog-te-gadget span {
            display: none !important;
        }

        @media (max-width: 600px) {
            .lang-floater {
                bottom: 80px; /* Shift up so it doesn't collide with bottom mobile nav if any */
                left: 15px;
            }
        }
    </style>

    <div class="lang-floater">
        <i class="fas fa-language"></i>
        <div id="google_translate_element"></div>
    </div>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</div>
